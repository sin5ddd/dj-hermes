# Hermes profile sample: play-hermes (exhibit-isolated, one song, no DJ mix)
# Copy into a real profile after `hermes profile create play-hermes --no-skills`
# — see README.md in this directory.
#
# Do NOT commit machine-local paths, API keys, or auth tokens here.

_config_version: 33

# Only the skills toolset (read composition guides) + MCP tools.
# Empty list alone is not enough on some Hermes versions: x_search can
# auto-enable when xAI credentials exist. Keep agent.disabled_toolsets below.
platform_toolsets:
  cli:
    - skills

# Strudel composition skills: copy from docs/profile/dj-hermes/skills/creative/
# except strudel-dj-mix (see README.md). Optional shared repo:
# skills:
#   external_dirs:
#     - ${PUREDATA_HERMES}/skills
#   write_approval: true
skills:
  # skill_manage create/edit stays staged until operator approves (exhibit safety).
  write_approval: true

# Keep MCP tool full schemas visible. "auto"/"on" defers MCP behind
# tool_search/tool_describe/tool_call — small local models often pass wrong
# argument names. Exhibit booth: off.
tools:
  tool_search:
    enabled: off

# Engine config for transcribe_recording (F12). Not a toolset grant —
# agent.disabled_toolsets still lists stt so the agent cannot transcribe paths.
stt:
  enabled: true
  provider: local
  language: ja
  local:
    model: base

mcp_servers:
  strudel:
    # Streamable HTTP against the running play API (no strudel-rs.exe spawn).
    # Start strudel-rs play first so :17878 is up. Port override: match --port.
    url: "http://127.0.0.1:17878/mcp"
    enabled: true
    tools:
      # Emergency stop stays on the operator keyboard: /hush or Esc in the TUI.
      exclude:
        - strudel_hush
      prompts: false
      resources: false

agent:
  max_turns: 8
  system_prompt: |
    You are a live Strudel play assistant for a public exhibit booth (strudel-rs).
    One song on deck A — not a two-deck DJ mix. Do not call mix/xfade/mixer EQ/filter/crossfader.
    Strudel here means SHORT looping `$:` tracks rewritten live — not long 16-bar cat arrangements.
    Use only strudel MCP tools. Create/change songs with strudel_apply_song(content, deck="A") — no disk write.
    Persist with strudel_save_song only when asked to keep the song. Small edits: get_song + edit_method/patch_track.
    Omit deck or pass deck="A". Never target deck B.
    content MUST be setcpm(...) plus 2–5 `$:` lines — never stack(...), never .cpm(), never file tools.
    Example content:
    // @title demo
    setcpm(128/4)
    $: s("bd*4, [~ sd]*2, [~ hh]*4").gain(0.5)
    $: note("0 2 0 3 0 <2 4>").scale("C2:minor").s("sawtooth").lpf(500).gain(0.7)
    No .lfo, no cp sample. Scalar .add/.sub/.ply OK. skill_view: composition first; live-edit for NL edits; strudel-seqtrak when SEQTRAK/MIDI.
    Off-topic or unsafe: refuse briefly in Japanese and call no tools.
  # Final override so auto-enable (x_search etc.) cannot leak tools back in.
  # Note: `skills` is intentionally NOT listed — progressive skill_view is allowed.
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - stt
    - todo
    - memory
    - context_engine
    - session_search
    - clarify
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - yuanbao
    - computer_use
    - kanban

# Model / provider are machine-local. Exhibit default is a local small model
# (network may be unavailable). Set after install, e.g.:
#   hermes --profile play-hermes model
# Or uncomment and fill:
# model:
#   provider: <provider>
#   default: <model-id>
#   base_url: <optional>
