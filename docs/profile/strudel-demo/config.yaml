# Hermes profile sample: strudel-demo (exhibit-isolated)
# Copy into a real profile after `hermes profile create strudel-demo --no-skills`
# — see README.md in this directory.
#
# Do NOT commit machine-local paths, API keys, or auth tokens here.

_config_version: 33

# No built-in toolsets on CLI. MCP tools still inject.
# Empty list alone is not enough on some Hermes versions: x_search can
# auto-enable when xAI credentials exist. Keep agent.disabled_toolsets below.
platform_toolsets:
  cli: []

mcp_servers:
  strudel:
    # Prefer PATH entry. Override with an absolute path on the target machine.
    # Windows example:
    #   command: "C:\\path\\to\\strudel-rs.exe"
    # Debug build example:
    #   command: "/path/to/strudel-rust/target/debug/strudel-rs"
    command: strudel-rs
    args: ["mcp"]
    env:
      STRUDEL_API: "http://127.0.0.1:17878"
    enabled: true
    tools:
      # Emergency stop stays on the operator keyboard: /hush or Esc in the TUI.
      exclude:
        - strudel_hush
      prompts: false
      resources: false

agent:
  max_turns: 8
  system_prompt: |
    You are a live Strudel DJ assistant for a public exhibit booth.
    Only use strudel MCP tools. Never use shell, files, browser, or web.
    Off-topic or unsafe requests: refuse briefly in Japanese and call no tools.
  # Final override so auto-enable (x_search etc.) cannot leak tools back in.
  disabled_toolsets:
    - web
    - browser
    - terminal
    - file
    - code_execution
    - vision
    - video
    - image_gen
    - video_gen
    - x_search
    - tts
    - stt
    - skills
    - todo
    - memory
    - context_engine
    - session_search
    - clarify
    - delegation
    - cronjob
    - homeassistant
    - spotify
    - yuanbao
    - computer_use
    - kanban

# Model / provider are machine-local. Set after install, e.g.:
#   hermes --profile strudel-demo model
# Or uncomment and fill:
# model:
#   provider: <provider>
#   default: <model-id>
#   base_url: <optional>
