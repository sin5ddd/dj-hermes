[package]
name = "strudel-rs"
version = "0.1.0"
edition = "2021"
description = "Strudel notation live-performance CLI (dual deck, bar-quantize)"
license = "MIT OR Apache-2.0"

[lib]
name = "strudel_rs"
path = "src/lib.rs"

[[bin]]
name = "strudel-rs"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
crossbeam = "0.8"
crossterm = "0.28"
notify = "6"
rustyline = "14"

[profile.release]
opt-level = 3
lto = true
strip = true
