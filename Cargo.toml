[package]
name = "strudel-rs"
version = "0.1.0"
edition = "2021"
description = "Strudel notation live-performance CLI (dual deck, bar-quantize)"
license = "MIT OR Apache-2.0"

[lib]
name = "strudel_rs"
path = "src/lib.rs"

[[bin]]
name = "strudel-rs"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
crossbeam = "0.8"
crossterm = "0.28"
rustyline = "14"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "multipart"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
